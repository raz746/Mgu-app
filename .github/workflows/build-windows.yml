name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mgu_manager.py'
      - '.github/workflows/build-windows.yml'
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify application source
        shell: pwsh
        run: |
          Write-Host "Checked-out commit: $env:GITHUB_SHA"
          Get-ChildItem -Force
          if (-not (Test-Path "mgu_manager.py")) { throw "mgu_manager.py missing from checked-out commit" }
          python -m py_compile mgu_manager.py
      - name: Install PyInstaller
        run: python -m pip install pyinstaller==6.16.0
      - name: Build EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name BMW-MGU-App-Manager mgu_manager.py
      - uses: actions/upload-artifact@v4
        with:
          name: BMW-MGU-App-Manager-Windows
          path: dist/BMW-MGU-App-Manager.exe
          if-no-files-found: error
