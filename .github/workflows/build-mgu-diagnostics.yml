name: Build MGU Store Diagnostics
on:
  workflow_dispatch:
  push:
    paths:
      - 'mgu_store_diagnostics.py'
      - '.github/workflows/build-mgu-diagnostics.yml'
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: python -m py_compile mgu_store_diagnostics.py
      - name: Install PyInstaller
        run: python -m pip install pyinstaller
      - name: Build executable
        run: python -m PyInstaller --onefile --windowed --name MGU-Store-Diagnostics mgu_store_diagnostics.py
      - uses: actions/upload-artifact@v4
        with:
          name: MGU-Store-Diagnostics-Windows
          path: dist/MGU-Store-Diagnostics.exe
